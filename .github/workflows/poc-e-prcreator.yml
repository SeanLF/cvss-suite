name: POC E PR creator
on:
  push:
    branches: [master]
permissions:
  contents: write
  pull-requests: write
jobs:
  make-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b poc-release-pr2
          echo bump >> POC_VERSION.txt
          git add -A && git commit -m "chore: release 9.9.9"
          git push origin poc-release-pr2 --force
          gh pr create --base master --head poc-release-pr2 --title "chore: release 9.9.9" --body poc
